# Builds the image and publishes it to the GitHub Container Registry.
#
# Triggers ONLY on a tag starting with "v" (e.g. v1.6.0), or manually from the
# Actions tab. Commits without a tag do not touch the published image: you can
# work in peace without servers offering you half-finished updates.
#
# A MANUAL run is a dry run: it tests, builds and starts the image, and
# publishes NOTHING. It can also remove one package from the Dockerfile first
# (`inject`), to see the smoke test go red for the reason it exists.
#
# NO secret needs configuring: GITHUB_TOKEN is generated by GitHub on every
# run, is valid only for this repository and expires with the run.
#
# After the first push the package is created PRIVATE: make it public once,
# under Profile -> Packages -> archivist-mcp -> Package settings.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      inject:
        description: 'Dry run only: remove this package from the image and expect the smoke test to fail'
        type: choice
        default: none
        options: [none, fonts-liberation, fonts-dejavu-core, libpangoft2-1.0-0]

jobs:
  # The engine suite, before anything is published. It needs no network and no
  # Docker, so it costs under a minute — and a tag that does not pass it never
  # becomes an image. Without this the only thing between a red test and a
  # published tag is remembering to run it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The engine's own suite FIRST, on a runner with nothing installed: the
      # absence of fastmcp is its fixture, and it proves the package imports
      # without it — which is what lets the preflight report on a broken image.
      - run: python3 test_engine.py

      # The same pins the image will use — one number, one place. --no-deps on
      # purpose: the suite needs no FastMCP, which is exactly why it can run
      # here in under a minute.
      - run: pip install --no-deps -r requirements.txt

      # The faces the two renderers embed and the text engine WeasyPrint dlopens,
      # the same packages the Dockerfile installs: the suite draws real pages, and
      # a runner without them fails by name. Every pip install here is --no-deps,
      # so WeasyPrint's own tree is pinned in requirements.txt beside it.
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core libpangoft2-1.0-0 libharfbuzz-subset0

      - run: python3 test_vault.py

      # The tag and the VERSION constant are two places holding the same number,
      # and on v2.2.0 they diverged: the image was the new one — the manual it
      # served proved it — and vault_status() still answered 2.1.0. Nothing was
      # broken, but the single line a deployment is verified by was a lie, which
      # is worse than a fault that announces itself, and nothing here would
      # have caught it.
      #
      # Only on a tag: workflow_dispatch has no version to compare against.
      - name: the version constant matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(python3 -c "import re,pathlib; print(re.search(r'^VERSION = \"([^\"]+)\"', pathlib.Path('server.py').read_text(), re.M).group(1))")
          echo "tag: $tag — server.py: $code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $tag but server.py says $code — bump VERSION before tagging"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # the only permission needed
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # A defect on purpose, for a manual run that wants to see the smoke test
      # fail. Only on workflow_dispatch, and a workflow_dispatch never pushes:
      # the two conditions cannot both hold, so an injected image cannot be
      # published.
      - name: inject a defect (dry run only)
        if: github.event_name == 'workflow_dispatch' && inputs.inject != 'none'
        run: |
          sed -i "s/ ${{ inputs.inject }}\b//" Dockerfile
          if grep -q "apt-get install.* ${{ inputs.inject }}" Dockerfile; then
            echo "::error::the injection did not remove ${{ inputs.inject }}"; exit 1
          fi
          grep -n 'apt-get install' Dockerfile

      # Built ONCE into the runner's own docker, started, and only then
      # published: the push below rebuilds from the same layers, already cached.
      - name: build the image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: archivist-mcp:smoke

      - name: smoke test — the image starts, refuses a stranger, draws a PDF
        run: scripts/smoke.sh archivist-mcp:smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # To publish for ARM as well (Raspberry Pi, recent Synology),
          # uncomment the line below: it doubles the build time.
          # platforms: linux/amd64,linux/arm64
